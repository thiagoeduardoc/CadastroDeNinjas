<!
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar Missão</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Alterar Missão</h1>
<div class="form-container">
    <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>

    <form th:action="@{/missoes/ui/atualizar/{id}(id=${missao.id})}" th:object="${missao}" method="post">

        <input type="hidden" th:field="*{id}">

        <label for="nome">Nome: </label>
        <input type="text" id="nome" th:field="*{nome}" required/>

        <label for="dificuldade">Dificuldade: </label>
        <input type="text" id="dificuldade" th:field="*{dificuldade}" required/>

        <button type="submit">Salvar Alterações</button>
    </form>
    <a th:href="@{/missoes/ui/listar}" class="btn-voltar">Voltar para a lista de Missões</a>
</div>
</body>
</html>
