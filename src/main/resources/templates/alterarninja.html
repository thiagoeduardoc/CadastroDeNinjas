<!
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar Ninja</title>
    <link rel="stylesheet" th:href="@{/css/style.css?v=2.0}">

</head>
<body>
<h1>Alterar Ninja</h1>
<div class="form-container">
    <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>
    <form th:action="@{/ninjas/ui/atualizar/{id}(id=${ninja.id})}" th:object="${ninja}" method="post">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" th:field="*{nome}" required/>

        <label for="email">E-mail: </label>
        <input type="text" id="email" th:field="*{email}" required/>

        <label for="imagemUrl">URL da imagem: </label>
        <input type="text" id="imagemUrl" th:field="*{imagemUrl}" required/>

        <label for="idade">Idade: </label>
        <input type="text" id="idade" th:field="*{idade}" required/>

        <label for="rank">Rank: </label>
        <input type="text" id="rank" th:field="*{rank}" required/>

        <label for="missoes">Atribuir Missão:</label>
        <select id="missoes" th:field="*{missoes}" class="form-control">
            <option value="">Selecione uma missão</option>

            <option th:each="m : ${missoes}"
                    th:value="${m.id}"
                    th:text="${m.nome + ' (' + m.dificuldade + ')'}">
            </option>
        </select>

        <button type="submit">Salvar Alterações</button>
    </form>
    <a th:href="@{/ninjas/ui/listar}" class="btn-voltar">Voltar para a lista de ninjas</a>
</div>
</body>
</html>
